schema_version: 1
title: Suite 530 · Spatial study
description: A proportionally traced architectural model of Exhibit A, with 
  explicit adjustable dimensional assumptions.
icon: sparkles
accent_color: '#4D7068'
routes:
  - path: home
    module: pages/home.js
    title: 3D model
    home: true
  - path: plan
    module: pages/plan.js
    title: Floor plan
  - path: furnishing
    module: pages/furnishing.js
    title: Furnishing
  - path: realistic
    module: pages/realistic.js
    title: Realistic view
styles:
  - styles.css
  - mobile.css
  - furnishing.css
  - realistic.css
  - walk.css
data:
  - id: geometry
    label: Suite 530 interpreted drawing geometry
    source: /table/geometry
catalogs:
  - source: geometry
    entity: traced element
    key: id
    of:
      id: {role: dimension, label: Element ID}
      kind: {role: dimension, label: Element type}
      label: {role: dimension, label: Interpretation}
      x1: {role: dimension, label: Drawing x1 in raster pixels}
      y1: {role: dimension, label: Drawing y1 in raster pixels}
      x2: {role: dimension, label: Drawing x2 in raster pixels}
      y2: {role: dimension, label: Drawing y2 in raster pixels}
    dimensions:
      - {name: kind, label: Element type, column: kind}
    measures:
      - {name: elements, label: Traced elements, expr: {rows: true}, agg: count, 
          adds: true}
engine: "1.32.0"
